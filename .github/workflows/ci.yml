name: CI

# Runs on every push and pull request to main. Deployment platforms can be
# configured to wait for this to pass before promoting a build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # No secrets are needed. The suite is fully offline: MongoDB and Groq are
    # both faked, so CI never touches Atlas or spends provider quota.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # A placeholder origin: the real one is injected by the hosting
        # platform at deploy time. This only proves the bundle compiles.
        env:
          VITE_API_BASE_URL: https://example.invalid/api
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a credential pattern appears in tracked files
        run: |
          # Deliberately narrow, so it fires on real credentials and not on
          # test fixtures:
          #   - a Groq key is gsk_ plus a long unbroken alphanumeric run; the
          #     fixture "gsk_fake_test_key_do_not_use" is broken by underscores
          #   - a real Atlas URI ends in .mongodb.net; the fixtures point at
          #     example.net and a bare "host", so neither matches
          # A pattern loose enough to catch those would fail on every run and
          # would soon be ignored, which is worse than a narrow one that works.
          if git grep -nE 'gsk_[A-Za-z0-9]{30,}|mongodb\+srv://[^ ]*:[^ ]*@[^ ]*\.mongodb\.net' -- . ':!*.lock'; then
            echo "::error::A credential-shaped string is present in tracked files"
            exit 1
          fi
          echo "No credential patterns found."

      - name: Fail if an environment file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$'; then
            echo "::error::A .env file is tracked by git"
            exit 1
          fi
          echo "No .env files tracked."
